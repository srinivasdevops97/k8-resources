# PersistentVolume(PV) creation
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-03819a1ce0de54e79
---
# PersistentVolumeClaim(PVc) creation
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Pod creation
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static
  purpose: ebs-static
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b
  containers:
  - name: nginx
    image: nginx
    volumeMounts:   # equivalent to docker run -v <host-path>:<container-path>
    - name: ebs-static
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-static
    persistentVolumeClaim:
      claimName: ebs-static
---
# Load Balancer creation
kind: Service
apiVersion: v1
metadata:
  name: nginx-lb  # name of the service
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-static
  ports:       # list of the ports
  - name: nginx-svc-port
    protocol: TCP
    port: 80      # service port
    targetPort: 80     # container port(another port)
    nodePort: 30007