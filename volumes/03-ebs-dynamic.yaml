# PersistentVolumeClaim(PVC) creation
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
spec:
  storageClassName: "expense-ebs"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
# Pod creation
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic
  labels:
    purpose: ebs-dynamic
spec:
  # nodeSelector:
  #   topology.kubernetes.io/zone: us-east-1b
  containers:
  - name: nginx
    image: nginx
    volumeMounts:   # equivalent to docker run -v <host-path>:<container-path>
    - name: ebs-dynamic
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-dynamic
    persistentVolumeClaim:
      claimName: ebs-dynamic
---
# Load Balancer creation
kind: Service
apiVersion: v1
metadata:
  name: nginx-lb  # name of the service
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-dynamic
  ports:       # list of the ports
  - name: nginx-svc-port
    protocol: TCP
    port: 80      # service port
    targetPort: 80     # container port(another port)
    nodePort: 30007